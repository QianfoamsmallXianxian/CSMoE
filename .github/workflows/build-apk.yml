name: Build CSMoE APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [ debug, release, both ]
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install CMake and build-tools
        run: |
          sdkmanager "cmake;3.18.1" "build-tools;30.0.3" "platforms;android-29"

      - name: Setup NDK r23b
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23b
          add-to-path: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Android/**/*.gradle*', 'Android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Ensure CSMoE-Full
        run: |
          if [ ! -d CSMoE-Full ]; then
            mkdir -p CSMoE-Full
            touch CSMoE-Full/.keep
          fi

      - name: Grant gradlew
        working-directory: Android
        run: chmod +x ./gradlew

      - name: Build Debug
        working-directory: Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find Android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \; || true
          ls -lh artifacts/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CSMoE-apk-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs-${{ github.sha }}
          path: |
            Android/**/build/reports/**
            Android/**/build/outputs/logs/**
            /home/runner/.gradle/daemon/**/daemon-*.out.log
          if-no-files-found: ignore
