name: Build CSMoE APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [ debug, release ]
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
  NDK_VERSION: "r23b"
  CMAKE_VERSION: "3.18.1"
  BUILD_TOOLS: "30.0.3"
  PLATFORM: "android-29"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          lfs: false

      - name: Init core submodules
        run: |
          set +e
          SKIP="3rdparty/angle 3rdparty/angle-static-cmake 3rdparty/bullet3 3rdparty/oneTBB"
          PATHS=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
          for m in $PATHS; do
            skip=0
            for s in $SKIP; do
              [ "$m" = "$s" ] && skip=1 && break
            done
            if [ "$skip" = "1" ]; then
              echo "::notice::skip $m"
              continue
            fi
            echo "=== init $m ==="
            git submodule update --init --depth 1 "$m" 2>&1 | tail -1
            [ "${PIPESTATUS[0]}" -ne 0 ] && echo "::warning::$m failed"
          done
          echo "=== 3rdparty 概览 ==="
          ls -1 3rdparty/ || true

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools'

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install SDK components
        run: |
          sdkmanager \
            "platforms;${PLATFORM}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;23.2.8568313" 2>&1 | tail -5

      - name: Setup NDK r23b
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23b
          add-to-path: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Android/**/*.gradle*', 'Android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare CSMoE-Full
        run: |
          mkdir -p CSMoE-Full
          [ -f CSMoE-Full/.keep ] || touch CSMoE-Full/.keep

      - name: Prepare local.properties
        run: |
          cat > Android/local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          ndk.dir=${ANDROID_NDK_HOME}
          cmake.dir=${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}
          EOF
          cat Android/local.properties

      - name: Grant gradlew
        run: chmod +x Android/gradlew

      - name: Build Debug APK
        working-directory: Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build_debug.log

      - name: Build Release APK (unsigned)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        working-directory: Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/build_release.log

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p artifacts
          find Android/app/build/outputs/apk -name "*.apk" -exec cp -v {} artifacts/ \; 2>/dev/null || true
          ls -lh artifacts/ 2>/dev/null || echo "no apk"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CSMoE-apk-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            /tmp/build_debug.log
            /tmp/build_release.log
            Android/**/build/reports/**
            Android/app/.cxx/**/cmake_build_output.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "## CSMoE Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK" >> $GITHUB_STEP_SUMMARY
          if ls artifacts/*.apk >/dev/null 2>&1; then
            echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            ls -lh artifacts/*.apk | awk '{print "| " $9 " | " $5 " |"}' >> $GITHUB_STEP_SUMMARY
          else
            echo "_无 APK 产出_" >> $GITHUB_STEP_SUMMARY
          fi
