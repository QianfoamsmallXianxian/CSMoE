name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      NDK_VERSION: 23.2.8568313
      CMAKE_VERSION: 3.22.1
      BUILD_TOOLS: 30.0.3
      PLATFORM: android-29
      ANDROID_SDK: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Init submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SKIP="3rdparty/angle 3rdparty/angle-static-cmake 3rdparty/bullet3 3rdparty/oneTBB 3rdparty/boost-mysql"
          PATHS=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
          for m in $PATHS; do
            skip=0
            for s in $SKIP; do
              [ "$m" = "$s" ] && skip=1 && break
            done
            [ "$skip" = "1" ] && { echo "skip $m"; continue; }
            git submodule update --init --depth 1 "$m" 2>&1 | tail -1
          done

      - name: Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Android SDK/NDK/CMake
        run: |
          SM="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;${PLATFORM}" "build-tools;${BUILD_TOOLS}" "cmake;${CMAKE_VERSION}" "ndk;${NDK_VERSION}" 2>&1 | tail -5

      - name: Write local.properties
        run: |
          mkdir -p CSMoE-Full
          [ -f CSMoE-Full/.keep ] || touch CSMoE-Full/.keep
          NDK_PATH="$ANDROID_SDK/ndk/${NDK_VERSION}"
          printf 'sdk.dir=%s\nndk.dir=%s\ncmake.dir=%s/cmake/%s\n' \
            "$ANDROID_SDK" "$NDK_PATH" "$ANDROID_SDK" "$CMAKE_VERSION" \
            > Android/local.properties
          cat Android/local.properties
          chmod +x Android/gradlew

      - name: Patch astc-encoder for NDK r23
        run: |
          ASTC_CORE=3rdparty/astc-encoder/Source/cmake_core.cmake
          ASTC_LIST=3rdparty/astc-encoder/Source/CMakeLists.txt

          if [ -f "$ASTC_CORE" ]; then
            sed -i 's|-ffp-contract=off||g' "$ASTC_CORE"
            sed -i 's|-Werror|-Wno-error|g' "$ASTC_CORE"
          fi

          if [ -f "$ASTC_LIST" ]; then
            if ! grep -q 'Wno-unsupported-floating-point-opt' "$ASTC_LIST"; then
              printf '\nif(TARGET astcenc-native-static)\n' >> "$ASTC_LIST"
              printf '    target_compile_options(astcenc-native-static PRIVATE\n' >> "$ASTC_LIST"
              printf '        -Wno-unsupported-floating-point-opt\n' >> "$ASTC_LIST"
              printf '        -Wno-error=unsupported-floating-point-opt)\n' >> "$ASTC_LIST"
              printf 'endif()\n' >> "$ASTC_LIST"
            fi
          fi

          echo "===== cmake_core.cmake ====="
          grep -nE 'march=|Werror|ffp-contract' "$ASTC_CORE" || true
          echo "===== CMakeLists tail ====="
          tail -20 "$ASTC_LIST" || true

          rm -rf Android/app/.cxx

      - name: Build debug APK
        working-directory: Android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log

      - name: Collect APK
        if: always()
        run: |
          mkdir -p artifacts
          find Android/app/build/outputs/apk -name '*.apk' -exec cp -v {} artifacts/ \; 2>/dev/null || true
          ls -lh artifacts/ 2>/dev/null || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: /tmp/build.log
          if-no-files-found: ignore
