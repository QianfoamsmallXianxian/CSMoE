name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      NDK_VERSION: 23.2.8568313
      CMAKE_VERSION: 3.22.1
      BUILD_TOOLS: 30.0.3
      PLATFORM: android-29
      ANDROID_SDK: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Init submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SKIP="3rdparty/angle 3rdparty/angle-static-cmake 3rdparty/bullet3 3rdparty/oneTBB 3rdparty/boost-mysql"
          PATHS=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
          for m in $PATHS; do
            skip=0
            for s in $SKIP; do
              [ "$m" = "$s" ] && skip=1 && break
            done
            [ "$skip" = "1" ] && { echo "skip $m"; continue; }
            git submodule update --init --depth 1 "$m" 2>&1 | tail -1
          done

      - name: Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Android SDK/NDK/CMake
        run: |
          SM="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;${PLATFORM}" "build-tools;${BUILD_TOOLS}" "cmake;${CMAKE_VERSION}" "ndk;${NDK_VERSION}" 2>&1 | tail -5

      - name: Write local.properties
        run: |
          mkdir -p CSMoE-Full
          [ -f CSMoE-Full/.keep ] || touch CSMoE-Full/.keep
          NDK_PATH="$ANDROID_SDK/ndk/${NDK_VERSION}"
          printf 'sdk.dir=%s\nndk.dir=%s\ncmake.dir=%s/cmake/%s\n' \
            "$ANDROID_SDK" "$NDK_PATH" "$ANDROID_SDK" "$CMAKE_VERSION" \
            > Android/local.properties
          cat Android/local.properties
          chmod +x Android/gradlew

      - name: Patch CI fixes
        run: |
          B=3rdparty/boost-cmake/CMakeLists.txt
          if [ -f "$B" ]; then
            sed -i '/URL_HASH SHA256/d' "$B"
            sed -i 's|boostorg.jfrog.io/artifactory/main/release|archives.boost.io/release|g' "$B"
            grep -n "boost_1_77_0" "$B" || true
          fi

          H=3rdparty/mpg123/src/include/mpg123.h
          T=3rdparty/mpg123/src/libmpg123/mpg123.h.in
          if [ -f "$H" ] && [ ! -f "$T" ]; then
            cp "$H" "$T"
          fi

          M=3rdparty/mpg123-cmake/src/libmpg123/CMakeLists.txt
          [ -f "$M" ] && sed -i '/lfs_alias/d' "$M"

          C=3rdparty/CMakeLists.txt
          if [ -f "$C" ]; then
            sed -i 's/PNG_BUILD_ZLIB ON/PNG_BUILD_ZLIB OFF/g' "$C"
            sed -i '/add_subdirectory(${CMAKE_SOURCE_DIR}\/3rdparty\/bullet3/d' "$C"
            sed -i '/target_link_libraries(3rdparty-bullet3/d' "$C"
            sed -i '/target_include_directories(3rdparty-bullet3/d' "$C"
            grep -q "PNG::PNG ALIAS" "$C" || \
              sed -i '/target_link_libraries(3rdparty-png INTERFACE png_static/a add_library(PNG::PNG ALIAS png_static)' "$C"
          fi

          python3 - <<'PY'
          import os
          for cmake in ["cl_dll/CMakeLists.txt", "dlls/CMakeLists.txt"]:
              if not os.path.exists(cmake):
                  continue
              base = os.path.dirname(cmake)
              lines = open(cmake, encoding="utf-8").read().splitlines()
              out = []
              for ln in lines:
                  s = ln.strip()
                  if s.startswith(("./", "../")):
                      ext = os.path.splitext(s)[1].lower()
                      if ext in (".cpp",".c",".cc",".cxx",".h",".hpp",".s"):
                          full = os.path.normpath(os.path.join(base, s))
                          if not os.path.exists(full):
                              out.append("# " + ln)
                              continue
                  out.append(ln)
              open(cmake, "w", encoding="utf-8").write("\n".join(out) + "\n")
          PY

          A=3rdparty/astc-encoder/Source/cmake_core.cmake
          L=3rdparty/astc-encoder/Source/CMakeLists.txt
          if [ -f "$A" ]; then
            sed -i 's|is_clangcl}:-march=native>|is_clangcl}:-march=armv8-a>|g' "$A"
            sed -i 's|is_gnu_fe}:-march=native>|is_gnu_fe}:-march=armv8-a>|g' "$A"
            sed -i 's|-ffp-contract=off||g' "$A"
            sed -i 's|-Werror|-Wno-error|g' "$A"
          fi
          if [ -f "$L" ]; then
            if ! grep -q 'Wno-unsupported-floating-point-opt' "$L"; then
              printf '\nif(TARGET astcenc-native-static)\n' >> "$L"
              printf '    target_compile_options(astcenc-native-static PRIVATE\n' >> "$L"
              printf '        -Wno-unsupported-floating-point-opt\n' >> "$L"
              printf '        -Wno-error=unsupported-floating-point-opt)\n' >> "$L"
              printf 'endif()\n' >> "$L"
            fi
          fi

          rm -rf Android/app/.cxx

      - name: Build debug APK
        working-directory: Android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log

      - name: Collect APK
        if: always()
        run: |
          mkdir -p artifacts
          find Android/app/build/outputs/apk -name '*.apk' -exec cp -v {} artifacts/ \; 2>/dev/null || true
          ls -lh artifacts/ 2>/dev/null || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: /tmp/build.log
          if-no-files-found: ignore
