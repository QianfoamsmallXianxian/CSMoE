name: Build CSMoE APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [ debug, release ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "r23b"
  CMAKE_VERSION: "3.18.1"
  BUILD_TOOLS: "30.0.3"
  PLATFORM: "android-29"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init submodules
        run: |
          set +e
          SKIP="3rdparty/angle 3rdparty/angle-static-cmake 3rdparty/bullet3 3rdparty/oneTBB"
          PATHS=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
          for m in $PATHS; do
            skip=0
            for s in $SKIP; do
              [ "$m" = "$s" ] && skip=1 && break
            done
            [ "$skip" = "1" ] && { echo "skip $m"; continue; }
            git submodule update --init --depth 1 "$m" 2>&1 | tail -1
          done
          ls -1 3rdparty/ || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - run: |
          sdkmanager \
            "platforms;${PLATFORM}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}" 2>&1 | tail -5

      - id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23b
          add-to-path: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Android/**/*.gradle*', 'Android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: |
          mkdir -p CSMoE-Full
          [ -f CSMoE-Full/.keep ] || touch CSMoE-Full/.keep
          cat > Android/local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          ndk.dir=${{ steps.setup_ndk.outputs.ndk-path }}
          cmake.dir=${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}
          EOF
          chmod +x Android/gradlew

      - name: Build Debug
        working-directory: Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log

      - name: Build Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        working-directory: Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee -a /tmp/build.log

      - if: always()
        run: |
          mkdir -p artifacts
          find Android/app/build/outputs/apk -name "*.apk" -exec cp -v {} artifacts/ \; 2>/dev/null || true
          ls -lh artifacts/ 2>/dev/null || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CSMoE-apk-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            /tmp/build.log
            Android/**/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
