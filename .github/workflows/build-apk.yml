name: Build CSMoE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_VERSION: "3.22.1"
  BUILD_TOOLS: "30.0.3"
  PLATFORM: "android-29"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init submodules
        run: |
          set +e
          SKIP="3rdparty/angle 3rdparty/angle-static-cmake 3rdparty/bullet3 3rdparty/oneTBB 3rdparty/boost-mysql"
          PATHS=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
          for m in $PATHS; do
            skip=0
            for s in $SKIP; do
              [ "$m" = "$s" ] && skip=1 && break
            done
            [ "$skip" = "1" ] && { echo "skip $m"; continue; }
            git submodule update --init --depth 1 "$m" 2>&1 | tail -1
          done
          ls -1 3rdparty/ || true

      - name: Patch 3rdparty
        run: |
          set +e
          f=3rdparty/boost-cmake/CMakeLists.txt
          if [ -f "$f" ]; then
            sed -i '/URL_HASH SHA256/d' "$f"
            sed -i 's|boostorg.jfrog.io/artifactory/main/release|archives.boost.io/release|g' "$f"
          fi
          h=3rdparty/mpg123/src/include/mpg123.h
          t=3rdparty/mpg123/src/libmpg123/mpg123.h.in
          if [ -f "$h" ] && [ ! -f "$t" ]; then
            cp "$h" "$t"
          fi
          mf=3rdparty/mpg123-cmake/src/libmpg123/CMakeLists.txt
          if [ -f "$mf" ]; then
            sed -i '/lfs_alias/d' "$mf"
          fi
          cf=3rdparty/CMakeLists.txt
          if [ -f "$cf" ]; then
            sed -i 's/PNG_BUILD_ZLIB ON/PNG_BUILD_ZLIB OFF/g' "$cf"
            sed -i '/add_subdirectory(${CMAKE_SOURCE_DIR}\/3rdparty\/bullet3/d' "$cf"
            sed -i '/target_link_libraries(3rdparty-bullet3/d' "$cf"
            sed -i '/target_include_directories(3rdparty-bullet3/d' "$cf"
          fi
          echo "patched"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;${PLATFORM}" "build-tools;${BUILD_TOOLS}" "cmake;${CMAKE_VERSION}" 2>&1 | tail -3

      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c
          add-to-path: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Android/**/*.gradle*', 'Android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: 3rdparty/boost_1_77_0
          key: boost-1.77.0-${{ runner.os }}

      - name: Prepare
        run: |
          mkdir -p CSMoE-Full
          [ -f CSMoE-Full/.keep ] || touch CSMoE-Full/.keep
          printf 'sdk.dir=%s\nndk.dir=%s\ncmake.dir=%s/cmake/%s\n' \
            "$ANDROID_SDK_ROOT" "${{ steps.ndk.outputs.ndk-path }}" "$ANDROID_SDK_ROOT" "$CMAKE_VERSION" \
            > Android/local.properties
          cat Android/local.properties
          chmod +x Android/gradlew

      - name: Build
        working-directory: Android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log | tail -300

      - if: always()
        run: |
          mkdir -p artifacts
          find Android/app/build/outputs/apk -name "*.apk" -exec cp -v {} artifacts/ \; 2>/dev/null || true
          ls -lh artifacts/ 2>/dev/null || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: warn

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: /tmp/build.log
          if-no-files-found: ignore
